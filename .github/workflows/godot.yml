name: Godot client

# Exports the native client (packages/godot) for Windows x86_64, macOS universal, Linux x86_64 and Linux arm64 with a
# pinned Godot, as a check on every pull request and, on a v* tag, as zipped downloads on a GitHub Release.
#
# The `export` job (headless checks, the bots, the exports) runs on every pull request and should stay under ~10
# minutes. The pictures and benches under Xvfb render with Mesa's software GL and take 20+ minutes, so they are in the
# `pictures` job, which runs only when started by hand: Actions -> Godot client -> Run workflow (pick the branch), or
#   gh workflow run godot.yml --ref <branch>
#
# Release dry run (what a v* tag would build, without a tag and without a Release): run the workflow by hand with
# "pictures" turned off,
#   gh workflow run godot.yml --ref <branch> -f pictures=false
# The `export` job exports the four targets, zips them under the names the download page links to and uploads them
# as the artifact `varldstradet-builds` (Actions -> the run -> Artifacts). Only the `release` job, which runs on a
# v* tag alone, makes a GitHub Release; a manual run never does. packages/server/src/release.test.ts keeps this
# file's zip names and the download page's links in step.

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pictures:
        description: 'Also run the slow pictures and benches job (turn off for a release dry run: only the zips)'
        type: boolean
        default: true

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned: the editor and the export templates must match. Checksums from the release's SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
          templates-sha512: ${{ env.GODOT_TEMPLATES_SHA512 }}

      # M7b: the Xvfb + lavapipe packages (about 35 s of apt) install in the background while the cheap headless checks below
      # run; the shader compile step waits for them (apt.code) instead of installing them itself.
      - name: Install xvfb and lavapipe in the background (waited for by the shader compile step)
        run: |
          rm -f /tmp/apt.code
          sudo setsid nohup bash -c 'apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers > /tmp/apt.log 2>&1; echo $? > /tmp/apt.code' > /dev/null 2>&1 &
          echo "apt started in the background"

      - name: The generated files in the client are up to date with the shared code (strings, game data, the demo fixture)
        run: |
          pnpm godot:gen
          git diff --exit-code -- packages/godot/assets/sv.json packages/godot/assets/game.json packages/godot/assets/fixtures

      # (--check-only --script cannot be used here: it compiles one script without the project's autoloads, so every
      # reference to Settings, Strings or Net fails. Running the main scene loads and compiles every script instead.)
      - name: Run the main scene headless for a moment (script, scene and runtime errors fail here)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 60 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" run.log; then
            echo "::error::running the project reported errors or leaked at exit (see above)"; exit 1
          fi

      - name: Röstprat's codec, rules and two WebRTC peers exchanging sound packets (headless; the extension must be loaded)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . -- --voicecheck --require-webrtc 2>&1 | tee voicecheck.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|voicecheck: FAIL|leaked at exit|still in use at exit|Pages in use exist at exit" voicecheck.log; then
            echo "::error::the voice check reported errors (see above)"; exit 1
          fi
          grep -q "voicecheck: all ok" voicecheck.log

      - name: Run the Draugkryptan demo headless for a moment (the dungeon view, actors and HUD run on the recorded fixture)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 120 -- --demo 2>&1 | tee demo.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" demo.log; then
            echo "::error::the demo reported errors (see above)"; exit 1
          fi

      - name: Run the scripted fight on the demo headless (telegraphs, the boss bar, hits, the loot window)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 900 -- --demo --fight 2>&1 | tee fight.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" fight.log; then
            echo "::error::the scripted fight reported errors (see above)"; exit 1
          fi

      - name: Run the farm, the forest, the farmhouse and the village demos headless for a moment (the farm view, the sky, the sprites and the HUD run on the recorded maps)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          for demo in farm forest house village; do
            timeout 120 ~/godot/godot --headless --path . --quit-after 300 -- --demo=$demo --time=0.9 --weather=rain 2>&1 | tee "demo-$demo.log"
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" "demo-$demo.log"; then
              echo "::error::the $demo demo reported errors or leaked at exit (see above)"; exit 1
            fi
            grep -q "drawn (outdoor)" "demo-$demo.log" || { echo "::error::the $demo demo drew nothing"; exit 1; }
          done

      # M7a: the alive world (wind, water, fireflies, butterflies, falling leaves, chimney smoke, dawn mist, window light) with every
      # toggle on, on each quality preset, headless: the scripts, the MultiMeshes and the uniforms run (the shaders themselves are
      # compiled and looked at in the `pictures` job under Xvfb; the headless renderer draws nothing)
      - name: The alive world on every preset headless (--alive=all)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          # M7b: the hero also walks east in each (`--walk`, no server): footsteps are made by the ground under them and the ambience
          # mixes layers (nothing is played headless, but every step and layer is counted)
          for run in "farm lag summer" "village mellan summer" "farm hog autumn"; do
            set -- $run
            timeout 120 ~/godot/godot --headless --path . --quit-after 400 -- --demo=$1 --quality=$2 --alive=all --year=$3 --time=0.9 --walk 2>&1 | tee "alive-$1-$2.log"
            grep -q "^walk: .* footsteps" "alive-$1-$2.log" || { echo "::error::the hero made no footsteps on $1 / $2"; exit 1; }
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit|SHADER ERROR" "alive-$1-$2.log"; then
              echo "::error::the alive world on $1 / $2 reported errors or leaked at exit (see above)"; exit 1
            fi
            grep -q "drawn (outdoor)" "alive-$1-$2.log" || { echo "::error::the $1 demo drew nothing"; exit 1; }
          done

      # Shaders are not compiled by the headless renderer, so this is the one real compile check: a few seconds of a real
      # (software Vulkan under Xvfb, i.e. Forward+) render of the farm with the alive world on; any SHADER ERROR fails.
      # M7b: the headless bench (its scripts run and the process exits clean; headless frame times mean nothing) runs beside
      # it, and the apt install was started earlier in the job: together they take less than the compile step alone did (58 s).
      - name: The new shaders compile (Forward+ on lavapipe under Xvfb) beside the headless bench
        working-directory: packages/godot
        run: |
          set -uo pipefail
          (timeout 120 ~/godot/godot --headless --path . -- --bench=lag > bench.log 2>&1; echo $? > bench.code) &
          for i in $(seq 1 120); do test -f /tmp/apt.code && break; sleep 2; done
          cat /tmp/apt.log | tail -3
          test "$(cat /tmp/apt.code 2>/dev/null)" = 0 || { echo "::error::installing xvfb and lavapipe failed"; exit 1; }
          bad=0
          for q in mellan; do # (Låg's flat water is the old shader without its noise; the pictures job compiles it)
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 120 ~/godot/godot --path . --resolution 640x360 --quit-after 30 -- --demo=farm --quality=$q --alive=all --year=summer --time=0.9 2>&1 | tee "compile-$q.log"
            if grep -E "SHADER ERROR|Shader compilation failed|SCRIPT ERROR|Parse Error" "compile-$q.log"; then
              echo "::error::a shader or script failed on $q (see above)"; bad=1
            fi
            grep -q "Forward+" "compile-$q.log" || { echo "::error::the compile check did not run on Forward+"; bad=1; }
          done
          wait
          cat bench.log
          test "$(cat bench.code)" = 0 || { echo "::error::the bench did not exit clean"; bad=1; }
          grep -q "bench: done" bench.log || { echo "::error::the bench did not finish"; bad=1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" bench.log; then
            echo "::error::the bench reported errors or leaked at exit (see above)"; bad=1
          fi
          exit $bad

      # Two headless bots fight the first pack of Draugkryptan together against a server running in memory
      # (no Postgres: the server's MemoryStore). tools/bot-check.mts compares their reports; the same run also has the
      # arch walker, the creator check and the farmer.
      #
      # M5c: two headless bots play a run through the client against a server in memory: they walk to the färdport, the lead
      # starts, both clear zone 1, use the exit, vote on a runa and enter zone 2 (`--full` plays to the boss, locally).
      #
      # M6b: these two used to run one after the other (4 + 4 minutes) and the job was over its ~10 minute budget; they
      # are independent (each has servers of its own: 8097 and 8098, and 8200 with its run pair on 8202), so they run side
      # by side. Nothing they assert changed. (If one starves the other on a small runner, a timed wait fails: that is a
      # real signal to look at, not a reason to lengthen a limit.)
      - name: The Draugkryptan bots (fighters, walker, creator, farmer) and the run pair play side by side
        run: |
          set -uo pipefail
          (GODOT=~/godot/godot BOT_SECONDS=150 pnpm godot:bot > bot.log 2>&1; echo $? > bot.code) &
          (GODOT=~/godot/godot BOT_ONLY=run BOT_PORT=8200 BOT_RUN_SECONDS=480 pnpm godot:bot > runbots.log 2>&1; echo $? > runbots.code) &
          wait
          bad=0
          echo "== the Draugkryptan bots"; cat bot.log
          test "$(cat bot.code)" = 0 || { echo "::error::the Draugkryptan bots failed"; bad=1; }
          echo "== the run pair"; cat runbots.log
          test "$(cat runbots.code)" = 0 || { echo "::error::the run pair failed"; bad=1; }
          exit $bad

      # M6a–M6c: the same fighter pair in Frostjättens borg, Surts smedja, Helheim, Svartalfheims gruvor, Havsormens tempel,
      # Alvernas lund, Fenrisklyftan and Bifrost (the dev way in: DEV_TELEPORT=1, `dev saga`): each clears its first two packs
      # against a server in memory. The eight run side by side, each on ports of its own (a run uses its port and the next
      # two; gaps left). On Bifrost the pair also checks that Loke's illusions are drawn ghostly.
      - name: Two bots clear the first packs of each of the eight dungeons after Draugkryptan (the dev way in)
        run: |
          set -uo pipefail
          port=8100
          for d in frost surt hel dvarg orm alv fenrir loke; do
            (GODOT=~/godot/godot BOT_ONLY=dungeon BOT_DUNGEON=$d BOT_PORT=$port BOT_PACKS=2 BOT_SECONDS=240 pnpm godot:bot > "bot-$d.log" 2>&1; echo $? > "bot-$d.code") &
            port=$((port + 4))
          done
          wait
          bad=0
          for d in frost surt hel dvarg orm alv fenrir loke; do
            echo "== $d"; cat "bot-$d.log"
            test "$(cat "bot-$d.code")" = 0 || { echo "::error::the $d bot pair failed"; bad=1; }
          done
          exit $bad

      # M6a–M6c: every move of the mid-boss and the boss of each of the eight plays on the recorded dungeon, from the data
      # (scripts/demo_bosses.gd): the cast bar, the marks on the floor, the landing, the ice block or web, the burning ground,
      # the helpers, the pull, a mend's glow and the heal. The eight run side by side (about 25 s).
      - name: Play the bosses' moves of the eight dungeons and the saga's ending headless (telegraphs, cast bars, what they leave; the last banners and toasts)
        working-directory: packages/godot
        run: |
          set -uo pipefail
          for d in frost surt hel dvarg orm alv fenrir loke; do
            (timeout 150 ~/godot/godot --headless --path . -- --demo=$d --fight --once > "bosses-$d.log" 2>&1; echo $? > "bosses-$d.code") &
          done
          # M6c: the saga's ending, beside them: what the server sends when Loke falls (a "cleared" banner, a toast) and when
          # Völvan is handed the last chapter (banners, three toasts, the record past the last chapter, her window: "the saga is over")
          (timeout 150 ~/godot/godot --headless --path . -- --demo=loke --ending --once > ending-dungeon.log 2>&1; echo $? > ending-dungeon.code) &
          (timeout 150 ~/godot/godot --headless --path . -- --demo=ending --once > ending-village.log 2>&1; echo $? > ending-village.code) &
          wait
          # every dungeon's log is printed and every failure reported (one failing show must not hide the others)
          bad=0
          fail() { echo "::error::$1"; bad=1; }
          # every move of each boss cast once: the mid-boss's and the boss's: frost 1 + 4, surt 2 + 3, hel 2 + 3, dvarg 2 + 3, orm 2 + 4, alv 2 + 4, fenrir 2 + 4, loke 2 + 7
          declare -A casts=([frost]=5 [surt]=5 [hel]=5 [dvarg]=5 [orm]=6 [alv]=6 [fenrir]=6 [loke]=9)
          for d in frost surt hel dvarg orm alv fenrir loke; do
            echo "== $d"; cat "bosses-$d.log"
            if grep -E "^ERROR:|SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|bosses: FAIL|leaked at exit|still in use at exit|Pages in use exist at exit" "bosses-$d.log"; then
              fail "the $d boss show reported errors or leaked at exit (see above)"
            fi
            test "$(cat "bosses-$d.code")" = 0 || fail "the $d boss show did not end cleanly"
            grep -q "bosses: show finished" "bosses-$d.log" || fail "the $d boss show did not play to its end"
            # (the show checks what it fed: each mark is in the fx view after the cast, gone after the landing, a helper, an ice block or a web is an actor, a mend glows and its glow ends and the heal floats, a pull puts the hero next to the boss, the air's motes drift, Loke's helpers are drawn as ghostly illusions)
            grep -q "^bosses: ok" "bosses-$d.log" || fail "the $d boss show's own checks did not pass"
            test "$(grep -c 'casts,' "bosses-$d.log")" = "${casts[$d]}" || fail "the $d boss show did not cast every move"
          done
          for e in dungeon village; do
            echo "== the ending ($e)"; cat "ending-$e.log"
            if grep -E "^ERROR:|SCRIPT ERROR|Parse Error|Failed to load script|ending: FAIL|leaked at exit|still in use at exit|Pages in use exist at exit" "ending-$e.log"; then
              fail "the saga's ending ($e) reported errors or failed a check (see above)"
            fi
            test "$(cat "ending-$e.code")" = 0 || fail "the saga's ending ($e) did not end cleanly"
            grep -q "^ending: ok" "ending-$e.log" || fail "the saga's ending ($e) did not pass its own checks"
          done
          exit $bad

      - name: Export all four targets
        working-directory: packages/godot
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build"
          mkdir -p "$OUT/windows" "$OUT/linux-x86_64" "$OUT/linux-arm64" "$OUT/macos"
          export_one() {
            echo "== $1"
            ~/godot/godot --headless --path . --export-release "$1" "$2" 2>&1 | tee -a export.log
            test -s "$2"
          }
          export_one "Windows x86_64" "$OUT/windows/varldstradet.exe"
          export_one "Linux x86_64" "$OUT/linux-x86_64/varldstradet.x86_64"
          export_one "Linux arm64" "$OUT/linux-arm64/varldstradet.arm64"
          export_one "macOS universal" "$OUT/macos/varldstradet.zip"
          if grep -E "^ERROR|SCRIPT ERROR|Failed" export.log; then
            echo "::error::an export reported errors (see above)"; exit 1
          fi
          ls -la "$OUT"/*

      - name: Zip the exports
        run: |
          set -euo pipefail
          cd build
          # Stable names, no version in them: the server's download page links to releases/latest/download/<name>
          (cd windows && zip -q -r "../varldstradet-windows-x86_64.zip" .)
          (cd linux-x86_64 && zip -q -r "../varldstradet-linux-x86_64.zip" .)
          (cd linux-arm64 && zip -q -r "../varldstradet-linux-arm64.zip" .)
          mv macos/varldstradet.zip "varldstradet-macos-universal.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: varldstradet-builds
          path: build/*.zip
          if-no-files-found: error

  # Pictures and benches under Xvfb (software GL, slow): only on a manual run.
  pictures:
    if: github.event_name == 'workflow_dispatch' && inputs.pictures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
          templates-sha512: ${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Pictures of the farm under Xvfb (day, night, rain; software GL) and the farm bench
        working-directory: packages/godot
        run: |
          set -euo pipefail
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers
          mkdir -p "$GITHUB_WORKSPACE/shots"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -E "SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit" "shot-$name.log"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/$name.png")" -gt 20000
          }
          shot farm-day --demo=farm --at=18,14 --time=0.4
          shot farm-night --demo=farm --at=16,12 --time=0.9
          shot farm-rain --demo=farm --at=16,12 --time=0.4 --weather=rain
          shot forest-arch --demo=forest
          shot farm-bag --demo=farm --at=18,14 --time=0.4 --bag
          shot house-night --demo=house --time=0.9
          shot house-day --demo=house --time=0.4
          shot village-day --demo=village --time=0.4
          shot village-night --demo=village --time=0.9
          xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --bench=mellan --scene=farm 2>&1 | tee bench-farm.log
          grep -q "bench: done" bench-farm.log
          if grep -E "SCRIPT ERROR|leaked at exit|still in use at exit|Pages in use exist at exit" bench-farm.log; then
            echo "::error::the farm bench reported errors or leaked at exit"; exit 1
          fi
          for scene in house village; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --bench=mellan --scene=$scene 2>&1 | tee "bench-$scene.log"
            grep -q "bench: done" "bench-$scene.log"
            if grep -E "SCRIPT ERROR|leaked at exit|still in use at exit|Pages in use exist at exit" "bench-$scene.log"; then
              echo "::error::the $scene bench reported errors or leaked at exit"; exit 1
            fi
          done

      # M6a: a picture of each of the three new dungeons (the start room and the boss's hall) and of each boss move's marks,
      # under Xvfb (software GL). The ones worth keeping are copied into packages/godot/docs/ by hand.
      - name: Pictures of Frostjättens borg, Surts smedja and Helheim and of their bosses' moves under Xvfb
        working-directory: packages/godot
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/dungeons"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/dungeons/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -E "^ERROR:|SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit" "shot-$name.log"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/dungeons/$name.png")" -gt 20000
          }
          shot m6a-frost --demo=frost
          shot m6a-frost-hall --demo=frost --at=17,15
          shot m6a-surt --demo=surt
          shot m6a-surt-hall --demo=surt --at=31,34
          shot m6a-hel --demo=hel
          shot m6a-hel-hall --demo=hel --at=14,51
          shot m6a-isbjorn-charge --demo=frost --boss-move=isbjorn:charge
          shot m6a-rimturs-cleave --demo=frost --boss-move=rimturs:cleave
          shot m6a-rimturs-rain --demo=frost --boss-move=rimturs:rain
          shot m6a-rimturs-freeze --demo=frost --boss-move=rimturs:freeze:after
          shot m6a-rimturs-nova --demo=frost --boss-move=rimturs:nova
          shot m6a-smeden-slam --demo=surt --boss-move=smeden:slam
          shot m6a-smeden-pools --demo=surt --boss-move=smeden:pools:after
          shot m6a-surt-cleave --demo=surt --boss-move=surt:cleave
          shot m6a-surt-nova --demo=surt --boss-move=surt:nova
          shot m6a-garm-charge --demo=hel --boss-move=garm:charge
          shot m6a-garm-summon --demo=hel --boss-move=garm:summon:after
          shot m6a-hel-pull --demo=hel --boss-move=hel:pull
          shot m6a-hel-nova --demo=hel --boss-move=hel:nova
          shot m6a-hel-rain --demo=hel --boss-move=hel:rain

      # M6b: the same for Svartalfheims gruvor, Havsormens tempel and Alvernas lund: the start room, the boss's hall (the
      # hero off to one side, so the boss shows) and the marks of each move of the mid-boss and the boss.
      - name: Pictures of Svartalfheims gruvor, Havsormens tempel and Alvernas lund and of their bosses' moves under Xvfb
        working-directory: packages/godot
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/dungeons"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/dungeons/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -E "^ERROR:|SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit" "shot-$name.log"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/dungeons/$name.png")" -gt 20000
          }
          shot m6b-dvarg --demo=dvarg
          shot m6b-dvarg-hall --demo=dvarg --at=48,11
          shot m6b-jarnvakten-line --demo=dvarg --boss-move=jarnvakten:line
          shot m6b-jarnvakten-slam --demo=dvarg --boss-move=jarnvakten:slam
          shot m6b-fafner-cleave --demo=dvarg --boss-move=fafner:cleave
          shot m6b-fafner-pools-mark --demo=dvarg --boss-move=fafner:pools
          shot m6b-fafner-pools --demo=dvarg --boss-move=fafner:pools:after
          shot m6b-fafner-mend --demo=dvarg --boss-move=fafner:mend
          shot m6b-orm --demo=orm
          shot m6b-orm-hall --demo=orm --at=47,50
          shot m6b-blackis-pools --demo=orm --boss-move=blackis:pools:after
          shot m6b-blackis-line --demo=orm --boss-move=blackis:line
          shot m6b-jormungand-line --demo=orm --boss-move=jormungand:line
          shot m6b-jormungand-pull --demo=orm --boss-move=jormungand:pull
          shot m6b-jormungand-nova --demo=orm --boss-move=jormungand:nova
          shot m6b-jormungand-rain --demo=orm --boss-move=jormungand:rain
          shot m6b-alv --demo=alv
          shot m6b-alv-hall --demo=alv --at=27,48
          shot m6b-spindeldrottning-web --demo=alv --boss-move=spindeldrottning:freeze:after
          shot m6b-spindeldrottning-rain --demo=alv --boss-move=spindeldrottning:rain
          shot m6b-nattmara-nova --demo=alv --boss-move=nattmara:nova
          shot m6b-nattmara-pools --demo=alv --boss-move=nattmara:pools:after
          shot m6b-nattmara-mend --demo=alv --boss-move=nattmara:mend
          shot m6b-nattmara-summon --demo=alv --boss-move=nattmara:summon:after

      # M6c: the same for Fenrisklyftan and Bifrost: the start room, the boss's hall (the hero off to one side) and the marks
      # of each move of the mid-boss and the boss (Loke's two novas are `nova` and `nova#1`).
      - name: Pictures of Fenrisklyftan and Bifrost and of their bosses' moves under Xvfb
        working-directory: packages/godot
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/dungeons"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/dungeons/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -E "^ERROR:|SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit" "shot-$name.log"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/dungeons/$name.png")" -gt 20000
          }
          shot m6c-fenrir --demo=fenrir
          shot m6c-fenrir-hall --demo=fenrir --at=45,48
          shot m6c-skoll-charge --demo=fenrir --boss-move=skoll:charge
          shot m6c-skoll-nova --demo=fenrir --boss-move=skoll:nova
          shot m6c-fenrisulven-charge --demo=fenrir --boss-move=fenrisulven:charge
          shot m6c-fenrisulven-cleave --demo=fenrir --boss-move=fenrisulven:cleave
          shot m6c-fenrisulven-summon --demo=fenrir --boss-move=fenrisulven:summon:after
          shot m6c-fenrisulven-nova --demo=fenrir --boss-move=fenrisulven:nova
          shot m6c-loke --demo=loke
          shot m6c-loke-hall --demo=loke --at=34,51
          shot m6c-lokesskugga-rain --demo=loke --boss-move=lokesskugga:rain
          shot m6c-lokesskugga-nova --demo=loke --boss-move=lokesskugga:nova
          shot m6c-loke-cleave --demo=loke --boss-move=loke:cleave
          shot m6c-loke-snow --demo=loke --boss-move=loke:nova
          shot m6c-loke-pools --demo=loke --boss-move=loke:pools:after
          shot m6c-loke-mend --demo=loke --boss-move=loke:mend
          shot m6c-loke-pull --demo=loke --boss-move=loke:pull
          shot m6c-loke-hel --demo=loke --boss-move=loke:nova#1
          shot m6c-loke-line --demo=loke --boss-move=loke:line

      # M7a: the alive world under Xvfb (software GL): the pictures (all on Mellan, the pond also on Låg and Hög for the comparison)
      # and the farm and the village benches with everything on at once (`--alive=all`, night, summer). The ones worth keeping are
      # copied into packages/godot/docs/ by hand (m7a-lag-vs-hog is the two pond pictures side by side).
      - name: Pictures and benches of the alive world (wind, water, fireflies, leaves, smoke, mist) under Xvfb
        working-directory: packages/godot
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/m7a"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/m7a/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -v "status < 0" "shot-$name.log" | grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/m7a/$name.png")" -gt 20000
          }
          shot m7a-farm-windy --demo=farm --at=22,10 --time=0.4 --weather=wind --year=summer --quality=mellan
          shot m7a-pond-dusk --demo=farm --at=44,39 --time=0.74 --year=summer --quality=mellan
          shot m7a-summer-night --demo=farm --at=11,9 --time=0.92 --year=summer --quality=mellan
          shot m7a-autumn-leaves --demo=farm --at=12,5 --time=0.4 --year=autumn --quality=mellan
          shot m7a-pond-lag --demo=farm --at=44,39 --time=0.45 --year=summer --quality=lag
          shot m7a-pond-hog --demo=farm --at=44,39 --time=0.45 --year=summer --quality=hog
          shot m7b-sparrows --demo=farm --at=22,10 --time=0.4 --year=summer --quality=mellan --alive=all
          for scene in farm village; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --bench --scene=$scene --alive=all --time=0.9 --year=summer 2>&1 | tee "bench-alive-$scene.log"
            grep -q "bench: done" "bench-alive-$scene.log"
            if grep -E "SCRIPT ERROR|SHADER ERROR|leaked at exit|still in use at exit|Pages in use exist at exit" "bench-alive-$scene.log"; then
              echo "::error::the $scene alive-world bench reported errors or leaked at exit"; exit 1
            fi
          done

      # The farmer works a farm of its own (a second in-memory server) in a window under Xvfb and takes pictures at the
      # moments the owner asked for: watering, the bag and a chest open, a fish biting, a wild animal petted (M4b); and
      # the shop, the workbench, a refused fence, the farmhouse, the stove, the wardrobe, a talk, Köpingen, the class
      # stone, Völvan, the gear and the bus (M4c). The same run is checked headless by the bot step of the export job;
      # this one has a window and keeps the pictures.
      - name: The farmer in a window under Xvfb (pictures of the farm's work, the shop, the house, the wardrobe and the village)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/farmer"
          GODOT=~/godot/godot BOT_ONLY=farm BOT_FARM_SECONDS=900 BOT_FARM_SHOTS="$GITHUB_WORKSPACE/shots/farmer" \
            xvfb-run -a -s "-screen 0 1280x720x24" pnpm godot:bot 2>&1 | tee farmer.log
          for f in watering bag-open fishing-bite pet shop workbench not-yours house cook wardrobe talk village class volva gear bus; do test "$(stat -c %s "$GITHUB_WORKSPACE/shots/farmer/$f.png")" -gt 20000; done

      # M5c: the run pair under Xvfb takes the pictures of the arch window, a zone, the three cards, the end summary and the
      # tree window (software GL, so slowly: the same run is checked headless by the export job)
      - name: The run pair in a window under Xvfb (pictures of the arch window, a zone, the cards, the end of a run and the tree)
        if: always() # (the farmer's village walk is a slow-runner flake: it must not skip these pictures)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/run"
          GODOT=~/godot/godot BOT_ONLY=run BOT_RUN_SECONDS=900 BOT_RUN_SHOTS="$GITHUB_WORKSPACE/shots/run" \
            xvfb-run -a -s "-screen 0 1280x720x24" pnpm godot:bot 2>&1 | tee runpair.log
          for f in m5c-arch m5c-zone m5c-cards m5c-end m5c-tree; do test "$(stat -c %s "$GITHUB_WORKSPACE/shots/run/$f.png")" -gt 20000; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-screenshots
          path: |
            shots/*.png
            shots/dungeons/*.png
            shots/m7a/*.png
            shots/farmer/*.png
            shots/run/*.png
          if-no-files-found: warn


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: varldstradet-builds
          path: build
      - name: Attach the zips to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
