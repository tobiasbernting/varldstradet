name: Godot client

# Exports the native client (packages/godot) for Windows x86_64, macOS universal, Linux x86_64 and Linux arm64 with a
# pinned Godot, as a check on every pull request and, on a v* tag, as zipped downloads on a GitHub Release.

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the editor and the export templates must match. Checksums from the release's SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The generated files in the client are up to date with the shared code (strings, game data, the demo fixture)
        run: |
          pnpm godot:gen
          git diff --exit-code -- packages/godot/assets/sv.json packages/godot/assets/game.json packages/godot/assets/fixtures

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-templates-5

      - name: Download Godot ${{ env.GODOT_VERSION }} and its export templates (pinned, checksummed)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot/templates
          curl -fsSL -o editor.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA512}  editor.zip" | sha512sum -c -
          unzip -q editor.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          unzip -q -j templates.tpz -d ~/godot/templates \
            templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
            templates/linux_release.arm64 templates/macos.zip
          rm editor.zip templates.tpz

      - name: Put the templates where Godot looks
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ~/godot/godot --version

      - name: Import the project (makes the import cache and the class list the next steps need)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource" import.log; then
            echo "::error::the import reported errors (see above)"; exit 1
          fi

      # (--check-only --script cannot be used here: it compiles one script without the project's autoloads, so every
      # reference to Settings, Strings or Net fails. Running the main scene loads and compiles every script instead.)
      - name: Run the main scene headless for a moment (script, scene and runtime errors fail here)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 60 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" run.log; then
            echo "::error::running the project reported errors or leaked at exit (see above)"; exit 1
          fi

      - name: Run the Draugkryptan demo headless for a moment (the dungeon view, actors and HUD run on the recorded fixture)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 120 -- --demo 2>&1 | tee demo.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" demo.log; then
            echo "::error::the demo reported errors (see above)"; exit 1
          fi

      - name: Run the scripted fight on the demo headless (telegraphs, the boss bar, hits, the loot window)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 900 -- --demo --fight 2>&1 | tee fight.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" fight.log; then
            echo "::error::the scripted fight reported errors (see above)"; exit 1
          fi

      - name: Run the bench headless for a moment (the bench's scripts run and the process exits clean; headless frame times mean nothing)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . -- --bench=lag 2>&1 | tee bench.log
          grep -q "bench: done" bench.log || { echo "::error::the bench did not finish"; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" bench.log; then
            echo "::error::the bench reported errors or leaked at exit (see above)"; exit 1
          fi

      # Two headless bots fight the first pack of Draugkryptan together against a server running in memory
      # (no Postgres: the server's MemoryStore). tools/bot-check.mts compares their reports.
      - name: Two bots clear the first pack together (the server in memory, ACCESS=open, DEV_TELEPORT=1)
        run: |
          set -euo pipefail
          GODOT=~/godot/godot BOT_SECONDS=150 pnpm godot:bot 2>&1 | tee bot.log

      - name: Export all four targets
        working-directory: packages/godot
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build"
          mkdir -p "$OUT/windows" "$OUT/linux-x86_64" "$OUT/linux-arm64" "$OUT/macos"
          export_one() {
            echo "== $1"
            ~/godot/godot --headless --path . --export-release "$1" "$2" 2>&1 | tee -a export.log
            test -s "$2"
          }
          export_one "Windows x86_64" "$OUT/windows/varldstradet.exe"
          export_one "Linux x86_64" "$OUT/linux-x86_64/varldstradet.x86_64"
          export_one "Linux arm64" "$OUT/linux-arm64/varldstradet.arm64"
          export_one "macOS universal" "$OUT/macos/varldstradet.zip"
          if grep -E "^ERROR|SCRIPT ERROR|Failed" export.log; then
            echo "::error::an export reported errors (see above)"; exit 1
          fi
          ls -la "$OUT"/*

      - name: Zip the exports
        run: |
          set -euo pipefail
          cd build
          V="${GITHUB_REF_NAME//\//-}"
          (cd windows && zip -q -r "../varldstradet-${V}-windows-x86_64.zip" .)
          (cd linux-x86_64 && zip -q -r "../varldstradet-${V}-linux-x86_64.zip" .)
          (cd linux-arm64 && zip -q -r "../varldstradet-${V}-linux-arm64.zip" .)
          mv macos/varldstradet.zip "varldstradet-${V}-macos-universal.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: varldstradet-builds
          path: build/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: varldstradet-builds
          path: build
      - name: Attach the zips to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
