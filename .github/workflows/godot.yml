name: Godot client

# Exports the native client (packages/godot) for Windows x86_64, macOS universal, Linux x86_64 and Linux arm64 with a
# pinned Godot, as a check on every pull request and, on a v* tag, as zipped downloads on a GitHub Release.
#
# The `export` job (headless checks, the bots, the exports) runs on every pull request and should stay under ~10
# minutes. The pictures and benches under Xvfb render with Mesa's software GL and take 20+ minutes, so they are in the
# `pictures` job, which runs only when started by hand: Actions -> Godot client -> Run workflow (pick the branch), or
#   gh workflow run godot.yml --ref <branch>

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned: the editor and the export templates must match. Checksums from the release's SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
          templates-sha512: ${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: The generated files in the client are up to date with the shared code (strings, game data, the demo fixture)
        run: |
          pnpm godot:gen
          git diff --exit-code -- packages/godot/assets/sv.json packages/godot/assets/game.json packages/godot/assets/fixtures

      # (--check-only --script cannot be used here: it compiles one script without the project's autoloads, so every
      # reference to Settings, Strings or Net fails. Running the main scene loads and compiles every script instead.)
      - name: Run the main scene headless for a moment (script, scene and runtime errors fail here)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 60 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" run.log; then
            echo "::error::running the project reported errors or leaked at exit (see above)"; exit 1
          fi

      - name: Röstprat's codec, rules and two WebRTC peers exchanging sound packets (headless; the extension must be loaded)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . -- --voicecheck --require-webrtc 2>&1 | tee voicecheck.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|voicecheck: FAIL|leaked at exit|still in use at exit|Pages in use exist at exit" voicecheck.log; then
            echo "::error::the voice check reported errors (see above)"; exit 1
          fi
          grep -q "voicecheck: all ok" voicecheck.log

      - name: Run the Draugkryptan demo headless for a moment (the dungeon view, actors and HUD run on the recorded fixture)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 120 -- --demo 2>&1 | tee demo.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" demo.log; then
            echo "::error::the demo reported errors (see above)"; exit 1
          fi

      - name: Run the scripted fight on the demo headless (telegraphs, the boss bar, hits, the loot window)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . --quit-after 900 -- --demo --fight 2>&1 | tee fight.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" fight.log; then
            echo "::error::the scripted fight reported errors (see above)"; exit 1
          fi

      - name: Run the farm, the forest, the farmhouse and the village demos headless for a moment (the farm view, the sky, the sprites and the HUD run on the recorded maps)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          for demo in farm forest house village; do
            timeout 120 ~/godot/godot --headless --path . --quit-after 300 -- --demo=$demo --time=0.9 --weather=rain 2>&1 | tee "demo-$demo.log"
            if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" "demo-$demo.log"; then
              echo "::error::the $demo demo reported errors or leaked at exit (see above)"; exit 1
            fi
            grep -q "drawn (outdoor)" "demo-$demo.log" || { echo "::error::the $demo demo drew nothing"; exit 1; }
          done

      - name: Run the bench headless for a moment (the bench's scripts run and the process exits clean; headless frame times mean nothing)
        working-directory: packages/godot
        run: |
          set -euo pipefail
          timeout 120 ~/godot/godot --headless --path . -- --bench=lag 2>&1 | tee bench.log
          grep -q "bench: done" bench.log || { echo "::error::the bench did not finish"; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate|leaked at exit|still in use at exit|Pages in use exist at exit" bench.log; then
            echo "::error::the bench reported errors or leaked at exit (see above)"; exit 1
          fi

      # Two headless bots fight the first pack of Draugkryptan together against a server running in memory
      # (no Postgres: the server's MemoryStore). tools/bot-check.mts compares their reports.
      - name: Two bots clear the first pack together (the server in memory, ACCESS=open, DEV_TELEPORT=1)
        run: |
          set -euo pipefail
          GODOT=~/godot/godot BOT_SECONDS=150 pnpm godot:bot 2>&1 | tee bot.log

      - name: Export all four targets
        working-directory: packages/godot
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build"
          mkdir -p "$OUT/windows" "$OUT/linux-x86_64" "$OUT/linux-arm64" "$OUT/macos"
          export_one() {
            echo "== $1"
            ~/godot/godot --headless --path . --export-release "$1" "$2" 2>&1 | tee -a export.log
            test -s "$2"
          }
          export_one "Windows x86_64" "$OUT/windows/varldstradet.exe"
          export_one "Linux x86_64" "$OUT/linux-x86_64/varldstradet.x86_64"
          export_one "Linux arm64" "$OUT/linux-arm64/varldstradet.arm64"
          export_one "macOS universal" "$OUT/macos/varldstradet.zip"
          if grep -E "^ERROR|SCRIPT ERROR|Failed" export.log; then
            echo "::error::an export reported errors (see above)"; exit 1
          fi
          ls -la "$OUT"/*

      - name: Zip the exports
        run: |
          set -euo pipefail
          cd build
          # Stable names, no version in them: the server's download page links to releases/latest/download/<name>
          (cd windows && zip -q -r "../varldstradet-windows-x86_64.zip" .)
          (cd linux-x86_64 && zip -q -r "../varldstradet-linux-x86_64.zip" .)
          (cd linux-arm64 && zip -q -r "../varldstradet-linux-arm64.zip" .)
          mv macos/varldstradet.zip "varldstradet-macos-universal.zip"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: varldstradet-builds
          path: build/*.zip
          if-no-files-found: error

  # Pictures and benches under Xvfb (software GL, slow): only on a manual run.
  pictures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          editor-sha512: ${{ env.GODOT_EDITOR_SHA512 }}
          templates-sha512: ${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Pictures of the farm under Xvfb (day, night, rain; software GL) and the farm bench
        working-directory: packages/godot
        run: |
          set -euo pipefail
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers
          mkdir -p "$GITHUB_WORKSPACE/shots"
          shot() { # name, demo args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- "$@" --screenshot="$GITHUB_WORKSPACE/shots/$name.png" 2>&1 | tee "shot-$name.log"
            if grep -E "SCRIPT ERROR|Parse Error|leaked at exit|still in use at exit|Pages in use exist at exit" "shot-$name.log"; then
              echo "::error::$name: errors or leaks (see above)"; exit 1
            fi
            test "$(stat -c %s "$GITHUB_WORKSPACE/shots/$name.png")" -gt 20000
          }
          shot farm-day --demo=farm --at=18,14 --time=0.4
          shot farm-night --demo=farm --at=16,12 --time=0.9
          shot farm-rain --demo=farm --at=16,12 --time=0.4 --weather=rain
          shot forest-arch --demo=forest
          shot farm-bag --demo=farm --at=18,14 --time=0.4 --bag
          shot house-night --demo=house --time=0.9
          shot house-day --demo=house --time=0.4
          shot village-day --demo=village --time=0.4
          shot village-night --demo=village --time=0.9
          xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --bench=mellan --scene=farm 2>&1 | tee bench-farm.log
          grep -q "bench: done" bench-farm.log
          if grep -E "SCRIPT ERROR|leaked at exit|still in use at exit|Pages in use exist at exit" bench-farm.log; then
            echo "::error::the farm bench reported errors or leaked at exit"; exit 1
          fi
          for scene in house village; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --bench=mellan --scene=$scene 2>&1 | tee "bench-$scene.log"
            grep -q "bench: done" "bench-$scene.log"
            if grep -E "SCRIPT ERROR|leaked at exit|still in use at exit|Pages in use exist at exit" "bench-$scene.log"; then
              echo "::error::the $scene bench reported errors or leaked at exit"; exit 1
            fi
          done

      # The farmer works a farm of its own (a second in-memory server) in a window under Xvfb and takes pictures at the
      # moments the owner asked for: watering, the bag and a chest open, a fish biting, a wild animal petted (M4b); and
      # the shop, the workbench, a refused fence, the farmhouse, the stove, the wardrobe, a talk, Köpingen, the class
      # stone, Völvan, the gear and the bus (M4c). The same run is checked headless by the bot step of the export job;
      # this one has a window and keeps the pictures.
      - name: The farmer in a window under Xvfb (pictures of the farm's work, the shop, the house, the wardrobe and the village)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/shots/farmer"
          GODOT=~/godot/godot BOT_ONLY=farm BOT_FARM_SECONDS=900 BOT_FARM_SHOTS="$GITHUB_WORKSPACE/shots/farmer" \
            xvfb-run -a -s "-screen 0 1280x720x24" pnpm godot:bot 2>&1 | tee farmer.log
          for f in watering bag-open fishing-bite pet shop workbench not-yours house cook wardrobe talk village class volva gear bus; do test "$(stat -c %s "$GITHUB_WORKSPACE/shots/farmer/$f.png")" -gt 20000; done

      - uses: actions/upload-artifact@v4
        with:
          name: farm-screenshots
          path: |
            shots/*.png
            shots/farmer/*.png
          if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: varldstradet-builds
          path: build
      - name: Attach the zips to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
